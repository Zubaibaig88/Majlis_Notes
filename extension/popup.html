<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Majlis Notes</title>
<style>
  :root { --ink:#1d2433; --muted:#6b7387; --line:#e3e6ee; --bg:#fff; --soft:#f7f8fb; --navy:#14213d; --gold:#ffb703; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e9f0; --muted:#98a1b3; --line:#2a3242; --bg:#161b26; --soft:#1f2533; } }
  * { box-sizing: border-box; }
  body { margin:0; width: 380px; min-height: 420px; font: 13px/1.45 "Inter","Segoe UI",system-ui,sans-serif; color: var(--ink); background: var(--bg); }
  body.page { width: auto; max-width: 560px; margin: 32px auto; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; background: var(--navy); color:#fff; }
  .logo { width:30px; height:30px; border-radius:8px; background:var(--gold); color:var(--navy); font-weight:800; display:grid; place-items:center; }
  header b { font-size: 15px; } header small { display:block; opacity:.75; font-size: 11px; }
  nav { display:flex; border-bottom:1px solid var(--line); }
  nav button { flex:1; background:none; border:0; padding:10px; color:var(--muted); cursor:pointer; font: inherit; border-bottom:2px solid transparent; }
  nav button.on { color:var(--ink); border-color: var(--gold); font-weight:600; }
  section { padding: 14px 16px; display:none; } section.on { display:block; }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px; background: var(--soft); }
  .btn { border:1px solid var(--line); background: var(--bg); color: var(--ink); border-radius:8px; padding:7px 11px; cursor:pointer; font: inherit; }
  .btn.primary { background: var(--navy); color:#fff; border-color: var(--navy); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  ul { list-style:none; margin:0; padding:0; }
  li.m { padding:10px 0; border-bottom:1px solid var(--line); }
  li.m b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li.m .row { margin-top:6px; } li.m .btn { padding:4px 8px; font-size:12px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #e7f6ec; color:#16753a; }
  .badge.no { background:#fff4e5; color:#8a5300; }
  label { display:block; margin: 10px 0 4px; font-weight:600; font-size: 12px; }
  input[type=text], input[type=password], textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font: inherit; background: var(--bg); color: var(--ink); }
  .check { display:flex; gap:8px; align-items:center; margin: 8px 0; font-weight: 400; }
  .welcome { background: #fff7e6; color: #5b3b00; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .welcome { background:#3a2f0c; color:#ffd98a; } }
  .empty { text-align:center; padding: 30px 0; }
  #msg { min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>
<header><div class="logo">م</div><div><b>Majlis Notes</b><small>Meeting transcripts &amp; AI notes</small></div></header>
<nav>
  <button data-tab="now" class="on">Now</button>
  <button data-tab="history">History</button>
  <button data-tab="settings">Settings</button>
</nav>

<section id="now" class="on">
  <div class="welcome" id="welcome" hidden>
    <b>Welcome to Majlis Notes 👋</b><br>
    1. Start your Majlis Notes server (see README).<br>
    2. Open <b>Settings</b> and add the server address and access key.<br>
    3. Join a Google Meet call — Majlis Notes starts by itself.
  </div>
  <div class="card" id="nowCard"><span class="muted">Checking this tab…</span></div>
  <div class="row" style="margin-top:12px">
    <button class="btn" id="openDash">↗ Open dashboard</button>
  </div>
</section>

<section id="history">
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <span class="muted" id="histCount"></span>
    <button class="btn" id="syncAll">⟳ Sync now</button>
  </div>
  <ul id="list"></ul>
</section>

<section id="settings">
  <label>Server address</label>
  <input type="text" id="serverUrl" placeholder="http://localhost:8787">
  <label>Access key</label>
  <input type="password" id="token" placeholder="Same as MAJLIS_TOKEN on the server">
  <label class="check"><input type="checkbox" id="enabled"> Majlis Notes is on</label>
  <label class="check"><input type="checkbox" id="autoStart"> Start transcribing when I join a call</label>
  <label class="check"><input type="checkbox" id="autoCaptions"> Turn on captions for me (Google Meet)</label>
  <label class="check"><input type="checkbox" id="showPanel"> Show the live panel</label>
  <label class="check"><input type="checkbox" id="startMinimized"> Start the panel minimized</label>
  <label>"Tell others" message</label>
  <textarea id="notifyMessage" rows="3"></textarea>
  <div class="row" style="margin-top:12px">
    <button class="btn primary" id="save">Save</button>
    <button class="btn" id="test">Test connection</button>
  </div>
  <div id="msg" class="muted"></div>
</section>
<script src="popup.js"></script>
</body>
</html>
